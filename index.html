<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emaan's Birthday Countdown</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#9c27b0">
    <meta name="description" content="Beautiful countdown to Emaan's birthday">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #9c27b0, #e91e63);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .number {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.8;
        }

        .message {
            font-size: 1.1rem;
            margin: 30px 0;
            font-style: italic;
            opacity: 0.9;
        }

        .install-prompt {
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .install-prompt:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .notification-toggle {
            margin-top: 15px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notification-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Photo Gallery Styles */
        .photo-gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            opacity: 0.3;
        }

        .photo-slider {
            display: flex;
            width: 500%;
            height: 100%;
            animation: slidePhotos 25s linear infinite;
        }

        .photo-slide {
            width: 20%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .photo-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(1px) brightness(0.7);
            transition: all 0.5s ease;
        }

        @keyframes slidePhotos {
            0% { transform: translateX(0); }
            20% { transform: translateX(-20%); }
            40% { transform: translateX(-40%); }
            60% { transform: translateX(-60%); }
            80% { transform: translateX(-80%); }
            100% { transform: translateX(0); }
        }

        /* Floating Hearts Animation */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0.2;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Enhanced container with better backdrop */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Gallery toggle button */
        .gallery-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .gallery-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Photo upload area */
        .photo-upload {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            text-align: center;
            transition: all 0.3s ease;
            display: none;
        }

        .photo-upload.active {
            display: block;
        }

        .photo-upload:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .photo-upload input {
            display: none;
        }

        .upload-text {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .uploaded-photos {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .uploaded-photo {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .uploaded-photo:hover {
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .number {
                font-size: 2rem;
            }
            
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery-toggle {
                bottom: 15px;
                right: 15px;
                padding: 12px;
                font-size: 1.2rem;
            }

            .photo-upload {
                margin-top: 15px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Photo Gallery -->
    <div class="photo-gallery" id="photoGallery">
        <div class="photo-slider" id="photoSlider">
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=800&q=80" alt="Romantic moment" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800&q=80" alt="Beautiful memory" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=800&q=80" alt="Special day" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1518709779329-d0c176e80adc?w=800&q=80" alt="Love story" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=800&q=80" alt="Happy times" loading="lazy">
            </div>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- Gallery Toggle Button -->
    <button class="gallery-toggle" id="galleryToggle" title="Toggle Photo Gallery">📸</button>

    <div class="container">
        <h1>💖 Emaan's Birthday 💖</h1>
        <p class="subtitle">Countdown to July 29, 2025</p>
        
        <div class="countdown">
            <div class="time-unit">
                <span class="number" id="days">0</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">0</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">0</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">0</span>
                <span class="label">Seconds</span>
            </div>
        </div>
        
        <p class="message" id="message">Get ready for an amazing celebration! 🎉</p>
        
        <button class="install-prompt" id="installBtn">Install App</button>
        <button class="notification-toggle" id="notificationBtn">Enable Daily Reminders</button>
        
        <!-- Photo Upload Section -->
        <div class="photo-upload" id="photoUpload">
            <div class="upload-text">✨ Add Your Special Photos ✨</div>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 15px;">Click to upload photos that will appear in the background gallery</p>
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" style="cursor: pointer; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 25px; display: inline-block; transition: all 0.3s ease;">Choose Photos</label>
            <div class="uploaded-photos" id="uploadedPhotos"></div>
        </div>
    </div>

    <script>
        // Target date: July 29, 2025
        const targetDate = new Date('2025-07-29T00:00:00').getTime();
        
        // PWA Install prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        // Notification functionality
        const notificationBtn = document.getElementById('notificationBtn');
        
        notificationBtn.addEventListener('click', async () => {
            if ('Notification' in window && 'serviceWorker' in navigator) {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    notificationBtn.textContent = 'Reminders Enabled ✓';
                    notificationBtn.style.background = 'rgba(76, 175, 80, 0.3)';
                    
                    // Schedule daily notifications
                    if ('serviceWorker' in navigator && 'PushManager' in window) {
                        const registration = await navigator.serviceWorker.ready;
                        // In a real app, you'd set up push notifications with a server
                        // For now, we'll use local notifications
                        scheduleLocalNotifications();
                    }
                }
            }
        });

        function scheduleLocalNotifications() {
            // Schedule notification for tomorrow and subsequent days
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
            tomorrow.setHours(9, 0, 0, 0); // 9 AM
            
            const timeUntilTomorrow = tomorrow.getTime() - now.getTime();
            
            setTimeout(() => {
                if (targetDate > Date.now()) {
                    new Notification("Emaan's Birthday Countdown", {
                        body: `${Math.ceil((targetDate - Date.now()) / (1000 * 60 * 60 * 24))} days until Emaan's birthday! 💖`,
                        icon: '/icon-192.png',
                        badge: '/icon-192.png'
                    });
                }
                
                // Schedule for the next day
                setInterval(() => {
                    if (targetDate > Date.now()) {
                        new Notification("Emaan's Birthday Countdown", {
                            body: `${Math.ceil((targetDate - Date.now()) / (1000 * 60 * 60 * 24))} days until Emaan's birthday! 💖`,
                            icon: '/icon-192.png',
                            badge: '/icon-192.png'
                        });
                    }
                }, 24 * 60 * 60 * 1000); // Every 24 hours
            }, timeUntilTomorrow);
        }

        // Countdown timer
        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = targetDate - now;

            if (timeLeft > 0) {
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

                // Update message based on time left
                if (days === 0) {
                    document.getElementById('message').textContent = "Today is the special day! 🎂✨";
                } else if (days === 1) {
                    document.getElementById('message').textContent = "Tomorrow is the big day! 🎈";
                } else if (days <= 7) {
                    document.getElementById('message').textContent = "Less than a week to go! 🌟";
                } else if (days <= 30) {
                    document.getElementById('message').textContent = "The countdown is getting exciting! 💕";
                } else {
                    document.getElementById('message').textContent = "Get ready for an amazing celebration! 🎉";
                }
            } else {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('message').textContent = "🎉 Happy Birthday Emaan! 🎂✨💖";
            }
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Photo Gallery Management
        let galleryVisible = true;
        let userPhotos = JSON.parse(localStorage.getItem('birthdayPhotos') || '[]');
        let currentPhotoIndex = 0;

        const galleryToggle = document.getElementById('galleryToggle');
        const photoGallery = document.getElementById('photoGallery');
        const photoUpload = document.getElementById('photoUpload');
        const photoInput = document.getElementById('photoInput');
        const photoSlider = document.getElementById('photoSlider');
        const uploadedPhotos = document.getElementById('uploadedPhotos');

        // Toggle gallery visibility
        galleryToggle.addEventListener('click', () => {
            galleryVisible = !galleryVisible;
            photoGallery.style.opacity = galleryVisible ? '0.3' : '0';
            photoUpload.classList.toggle('active');
            galleryToggle.textContent = galleryVisible ? '📸' : '🖼️';
        });

        // Handle photo uploads
        photoInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        userPhotos.push(e.target.result);
                        localStorage.setItem('birthdayPhotos', JSON.stringify(userPhotos));
                        updateGallery();
                        displayUploadedPhotos();
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        // Update gallery with user photos
        function updateGallery() {
            if (userPhotos.length > 0) {
                photoSlider.innerHTML = '';
                const photosToShow = userPhotos.length >= 5 ? userPhotos.slice(0, 5) : [...userPhotos, ...getDefaultPhotos()].slice(0, 5);
                
                photosToShow.forEach(photoSrc => {
                    const slide = document.createElement('div');
                    slide.className = 'photo-slide';
                    slide.innerHTML = `<img src="${photoSrc}" alt="Memory" loading="lazy">`;
                    photoSlider.appendChild(slide);
                });
                
                // Restart animation
                photoSlider.style.animation = 'none';
                photoSlider.offsetHeight; // Trigger reflow
                photoSlider.style.animation = 'slidePhotos 25s linear infinite';
            }
        }

        // Display uploaded photos thumbnails
        function displayUploadedPhotos() {
            uploadedPhotos.innerHTML = '';
            userPhotos.forEach((photo, index) => {
                const img = document.createElement('img');
                img.src = photo;
                img.className = 'uploaded-photo';
                img.onclick = () => removePhoto(index);
                img.title = 'Click to remove';
                uploadedPhotos.appendChild(img);
            });
        }

        // Remove photo
        function removePhoto(index) {
            userPhotos.splice(index, 1);
            localStorage.setItem('birthdayPhotos', JSON.stringify(userPhotos));
            updateGallery();
            displayUploadedPhotos();
        }

        // Get default photos
        function getDefaultPhotos() {
            return [
                'https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=800&q=80',
                'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800&q=80',
                'https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=800&q=80',
                'https://images.unsplash.com/photo-1518709779329-d0c176e80adc?w=800&q=80',
                'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=800&q=80'
            ];
        }

        // Floating hearts animation
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = Math.random() > 0.5 ? '💖' : '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.fontSize = (Math.random() * 1 + 1.5) + 'rem';
            
            document.getElementById('floatingHearts').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        // Create floating hearts periodically
        setInterval(createFloatingHeart, 3000);

        // Initialize gallery
        updateGallery();
        displayUploadedPhotos();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
