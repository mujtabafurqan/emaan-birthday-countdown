<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emaan's Birthday Countdown</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#9c27b0">
    <meta name="description" content="Beautiful countdown to Emaan's birthday">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #9c27b0, #e91e63);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .number {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.8;
        }

        .message {
            font-size: 1.1rem;
            margin: 30px 0;
            font-style: italic;
            opacity: 0.9;
        }

        .install-prompt {
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .install-prompt:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .notification-toggle {
            margin-top: 15px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notification-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Photo Gallery Styles */
        .photo-gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            opacity: 0.6;
        }

        .photo-slider {
            display: flex;
            width: 500%;
            height: 100%;
            animation: slidePhotos 25s linear infinite;
        }

        .photo-slide {
            width: 20%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .photo-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(0.5px) brightness(0.85) contrast(1.1);
            transition: all 0.5s ease;
        }

        @keyframes slidePhotos {
            0% { transform: translateX(0); }
            20% { transform: translateX(-20%); }
            40% { transform: translateX(-40%); }
            60% { transform: translateX(-60%); }
            80% { transform: translateX(-80%); }
            100% { transform: translateX(0); }
        }

        /* Floating Hearts Animation */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0.2;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Enhanced container with better backdrop */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Gallery toggle button */
        .gallery-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .gallery-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Update notification */
        .update-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            z-index: 1001;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: none;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .update-notification.show {
            display: flex;
        }

        .update-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .update-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .refresh-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1) rotate(180deg);
        }

        /* Photo upload area */
        .photo-upload {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            text-align: center;
            transition: all 0.3s ease;
            display: none;
        }

        .photo-upload.active {
            display: block;
        }

        .photo-upload:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .photo-upload input {
            display: none;
        }

        .upload-text {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .uploaded-photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .photo-item {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .photo-item:hover {
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .uploaded-photo {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .photo-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            gap: 5px;
        }

        .photo-name {
            font-size: 0.7rem;
            opacity: 0.8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .remove-photo {
            background: rgba(255, 107, 107, 0.8);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .remove-photo:hover {
            background: rgba(255, 107, 107, 1);
            transform: scale(1.1);
        }

        .photo-counter {
            text-align: center;
            margin-top: 10px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .upload-status {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }

        .upload-status.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            display: block;
        }

        .upload-status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            display: block;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 8px;
            }
            
            .subtitle {
                font-size: 1rem;
                margin-bottom: 20px;
            }
            
            .container {
                padding: 25px 20px;
                max-width: 90%;
            }
            
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin: 20px 0;
            }
            
            .time-unit {
                padding: 15px 8px;
            }
            
            .number {
                font-size: 1.8rem;
            }
            
            .label {
                font-size: 0.8rem;
            }
            
            .message {
                font-size: 1rem;
                margin: 20px 0;
            }

            .gallery-toggle {
                bottom: 15px;
                right: 15px;
                padding: 12px;
                font-size: 1.2rem;
            }

            .refresh-btn {
                bottom: 75px;
                right: 15px;
                padding: 10px;
                font-size: 1rem;
            }

            .photo-upload {
                margin-top: 15px;
                padding: 15px;
            }
            
            .update-notification {
                top: 10px;
                padding: 12px 20px;
                font-size: 0.8rem;
            }
            
            .uploaded-photos {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            
            .photo-item {
                padding: 6px;
            }
            
            .uploaded-photo {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Photo Gallery -->
    <div class="photo-gallery" id="photoGallery">
        <div class="photo-slider" id="photoSlider">
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=1200&q=90" alt="Romantic moment" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=1200&q=90" alt="Beautiful memory" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1200&q=90" alt="Special day" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1518709779329-d0c176e80adc?w=1200&q=90" alt="Love story" loading="lazy">
            </div>
            <div class="photo-slide">
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1200&q=90" alt="Happy times" loading="lazy">
            </div>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- Update Notification -->
    <div class="update-notification" id="updateNotification">
        <span>✨ New version available!</span>
        <button class="update-btn" id="updateBtn">Refresh</button>
    </div>

    <!-- Gallery Toggle Button -->
    <button class="gallery-toggle" id="galleryToggle" title="Toggle Photo Gallery">📸</button>
    
    <!-- Refresh Button -->
    <button class="refresh-btn" id="refreshBtn" title="Refresh App">🔄</button>

    <div class="container">
        <h1>💖 Emaan's Birthday 💖</h1>
        <p class="subtitle">Countdown to July 29, 2025</p>
        
        <div class="countdown">
            <div class="time-unit">
                <span class="number" id="days">0</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">0</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">0</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">0</span>
                <span class="label">Seconds</span>
            </div>
        </div>
        
        <p class="message" id="message">Get ready for an amazing celebration! 🎉</p>
        
        <button class="install-prompt" id="installBtn">Install App</button>
        <button class="notification-toggle" id="notificationBtn">Enable Daily Reminders</button>
        
        <!-- Photo Upload Section -->
        <div class="photo-upload" id="photoUpload">
            <div class="upload-text">✨ Add Your Special Photos ✨</div>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 15px;">Click to upload photos that will appear in the background gallery</p>
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" style="cursor: pointer; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 25px; display: inline-block; transition: all 0.3s ease;">Choose Photos</label>
            
            <div class="upload-status" id="uploadStatus"></div>
            <div class="photo-counter" id="photoCounter">No photos uploaded</div>
            <div class="uploaded-photos" id="uploadedPhotos"></div>
        </div>
    </div>

    <script>
        // Target date: July 29, 2025
        const targetDate = new Date('2025-07-29T00:00:00').getTime();
        
        // PWA Install prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        // Notification functionality
        const notificationBtn = document.getElementById('notificationBtn');
        
        notificationBtn.addEventListener('click', async () => {
            if ('Notification' in window && 'serviceWorker' in navigator) {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    notificationBtn.textContent = 'Reminders Enabled ✓';
                    notificationBtn.style.background = 'rgba(76, 175, 80, 0.3)';
                    
                    // Schedule daily notifications
                    if ('serviceWorker' in navigator && 'PushManager' in window) {
                        const registration = await navigator.serviceWorker.ready;
                        // In a real app, you'd set up push notifications with a server
                        // For now, we'll use local notifications
                        scheduleLocalNotifications();
                    }
                }
            }
        });

        function scheduleLocalNotifications() {
            // Schedule notification for tomorrow and subsequent days
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
            tomorrow.setHours(9, 0, 0, 0); // 9 AM
            
            const timeUntilTomorrow = tomorrow.getTime() - now.getTime();
            
            setTimeout(() => {
                if (targetDate > Date.now()) {
                    new Notification("Emaan's Birthday Countdown", {
                        body: `${Math.ceil((targetDate - Date.now()) / (1000 * 60 * 60 * 24))} days until Emaan's birthday! 💖`,
                        icon: '/icon-192.png',
                        badge: '/icon-192.png'
                    });
                }
                
                // Schedule for the next day
                setInterval(() => {
                    if (targetDate > Date.now()) {
                        new Notification("Emaan's Birthday Countdown", {
                            body: `${Math.ceil((targetDate - Date.now()) / (1000 * 60 * 60 * 24))} days until Emaan's birthday! 💖`,
                            icon: '/icon-192.png',
                            badge: '/icon-192.png'
                        });
                    }
                }, 24 * 60 * 60 * 1000); // Every 24 hours
            }, timeUntilTomorrow);
        }

        // Countdown timer
        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = targetDate - now;

            if (timeLeft > 0) {
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

                // Update message based on time left
                if (days === 0) {
                    document.getElementById('message').textContent = "Today is the special day! 🎂✨";
                } else if (days === 1) {
                    document.getElementById('message').textContent = "Tomorrow is the big day! 🎈";
                } else if (days <= 7) {
                    document.getElementById('message').textContent = "Less than a week to go! 🌟";
                } else if (days <= 30) {
                    document.getElementById('message').textContent = "The countdown is getting exciting! 💕";
                } else {
                    document.getElementById('message').textContent = "Get ready for an amazing celebration! 🎉";
                }
            } else {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('message').textContent = "🎉 Happy Birthday Emaan! 🎂✨💖";
            }
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Photo Gallery Management
        let galleryVisible = true;
        let userPhotos = JSON.parse(localStorage.getItem('birthdayPhotos') || '[]');
        let photoMetadata = JSON.parse(localStorage.getItem('birthdayPhotosMetadata') || '[]');
        let currentPhotoIndex = 0;

        const galleryToggle = document.getElementById('galleryToggle');
        const photoGallery = document.getElementById('photoGallery');
        const photoUpload = document.getElementById('photoUpload');
        const photoInput = document.getElementById('photoInput');
        const photoSlider = document.getElementById('photoSlider');
        const uploadedPhotos = document.getElementById('uploadedPhotos');
        const uploadStatus = document.getElementById('uploadStatus');
        const photoCounter = document.getElementById('photoCounter');

        // Toggle gallery visibility
        galleryToggle.addEventListener('click', () => {
            galleryVisible = !galleryVisible;
            photoGallery.style.opacity = galleryVisible ? '0.6' : '0';
            photoUpload.classList.toggle('active');
            galleryToggle.textContent = galleryVisible ? '📸' : '🖼️';
        });

        // Handle photo uploads
        photoInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let successCount = 0;
            let errorCount = 0;
            
            if (files.length === 0) return;
            
            // Show uploading status
            showUploadStatus('Uploading photos...', 'info');
            
            files.forEach((file, index) => {
                if (file.type.startsWith('image/')) {
                    // Check file size (limit to 5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        errorCount++;
                        if (index === files.length - 1) {
                            showFinalUploadStatus(successCount, errorCount);
                        }
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const photoId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        userPhotos.push(e.target.result);
                        photoMetadata.push({
                            id: photoId,
                            name: file.name,
                            size: file.size,
                            uploadDate: new Date().toISOString()
                        });
                        
                        localStorage.setItem('birthdayPhotos', JSON.stringify(userPhotos));
                        localStorage.setItem('birthdayPhotosMetadata', JSON.stringify(photoMetadata));
                        
                        successCount++;
                        updateGallery();
                        displayUploadedPhotos();
                        updatePhotoCounter();
                        
                        if (successCount + errorCount === files.length) {
                            showFinalUploadStatus(successCount, errorCount);
                        }
                    };
                    
                    reader.onerror = () => {
                        errorCount++;
                        if (successCount + errorCount === files.length) {
                            showFinalUploadStatus(successCount, errorCount);
                        }
                    };
                    
                    reader.readAsDataURL(file);
                } else {
                    errorCount++;
                    if (successCount + errorCount === files.length) {
                        showFinalUploadStatus(successCount, errorCount);
                    }
                }
            });
            
            // Clear the input
            photoInput.value = '';
        });

        // Update gallery with user photos
        function updateGallery() {
            if (userPhotos.length > 0) {
                photoSlider.innerHTML = '';
                const photosToShow = userPhotos.length >= 5 ? userPhotos.slice(0, 5) : [...userPhotos, ...getDefaultPhotos()].slice(0, 5);
                
                photosToShow.forEach(photoSrc => {
                    const slide = document.createElement('div');
                    slide.className = 'photo-slide';
                    slide.innerHTML = `<img src="${photoSrc}" alt="Memory" loading="lazy">`;
                    photoSlider.appendChild(slide);
                });
                
                // Restart animation
                photoSlider.style.animation = 'none';
                photoSlider.offsetHeight; // Trigger reflow
                photoSlider.style.animation = 'slidePhotos 25s linear infinite';
            }
        }

        // Display uploaded photos thumbnails
        function displayUploadedPhotos() {
            uploadedPhotos.innerHTML = '';
            userPhotos.forEach((photo, index) => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const img = document.createElement('img');
                img.src = photo;
                img.className = 'uploaded-photo';
                img.onclick = () => previewPhoto(photo);
                img.title = 'Click to preview';
                
                const actions = document.createElement('div');
                actions.className = 'photo-actions';
                
                const photoName = document.createElement('div');
                photoName.className = 'photo-name';
                photoName.textContent = photoMetadata[index]?.name || `Photo ${index + 1}`;
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-photo';
                removeBtn.innerHTML = '×';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removePhoto(index);
                };
                removeBtn.title = 'Remove photo';
                
                actions.appendChild(photoName);
                actions.appendChild(removeBtn);
                
                photoItem.appendChild(img);
                photoItem.appendChild(actions);
                uploadedPhotos.appendChild(photoItem);
            });
        }

        // Remove photo
        function removePhoto(index) {
            if (confirm('Are you sure you want to remove this photo?')) {
                userPhotos.splice(index, 1);
                photoMetadata.splice(index, 1);
                localStorage.setItem('birthdayPhotos', JSON.stringify(userPhotos));
                localStorage.setItem('birthdayPhotosMetadata', JSON.stringify(photoMetadata));
                updateGallery();
                displayUploadedPhotos();
                updatePhotoCounter();
                
                showUploadStatus('Photo removed successfully', 'success');
                setTimeout(() => hideUploadStatus(), 2000);
            }
        }

        // Preview photo in a modal-like view
        function previewPhoto(photoSrc) {
            const preview = document.createElement('div');
            preview.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                backdrop-filter: blur(10px);
            `;
            
            const img = document.createElement('img');
            img.src = photoSrc;
            img.style.cssText = `
                max-width: 90%;
                max-height: 90%;
                border-radius: 15px;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            `;
            
            preview.appendChild(img);
            preview.onclick = () => document.body.removeChild(preview);
            document.body.appendChild(preview);
        }

        // Update photo counter
        function updatePhotoCounter() {
            const count = userPhotos.length;
            if (count === 0) {
                photoCounter.textContent = 'No photos uploaded';
            } else if (count === 1) {
                photoCounter.textContent = '1 photo uploaded';
            } else {
                photoCounter.textContent = `${count} photos uploaded`;
            }
        }

        // Show upload status
        function showUploadStatus(message, type) {
            uploadStatus.textContent = message;
            uploadStatus.className = `upload-status ${type}`;
        }

        // Hide upload status
        function hideUploadStatus() {
            uploadStatus.className = 'upload-status';
        }

        // Show final upload status
        function showFinalUploadStatus(successCount, errorCount) {
            if (errorCount === 0) {
                showUploadStatus(`Successfully uploaded ${successCount} photo${successCount !== 1 ? 's' : ''}!`, 'success');
            } else if (successCount === 0) {
                showUploadStatus(`Failed to upload ${errorCount} photo${errorCount !== 1 ? 's' : ''}. Please try again.`, 'error');
            } else {
                showUploadStatus(`Uploaded ${successCount} photo${successCount !== 1 ? 's' : ''}, ${errorCount} failed.`, 'success');
            }
            
            setTimeout(() => hideUploadStatus(), 4000);
        }

        // Get default photos
        function getDefaultPhotos() {
            return [
                'https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=1200&q=90',
                'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=1200&q=90',
                'https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1200&q=90',
                'https://images.unsplash.com/photo-1518709779329-d0c176e80adc?w=1200&q=90',
                'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1200&q=90'
            ];
        }

        // Floating hearts animation
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = Math.random() > 0.5 ? '💖' : '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.fontSize = (Math.random() * 1 + 1.5) + 'rem';
            
            document.getElementById('floatingHearts').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        // Create floating hearts periodically
        setInterval(createFloatingHeart, 3000);

        // Initialize gallery
        updateGallery();
        displayUploadedPhotos();
        updatePhotoCounter();

        // PWA Update Management
        let swRegistration = null;
        const updateNotification = document.getElementById('updateNotification');
        const updateBtn = document.getElementById('updateBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        // Register service worker with update detection
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(registration => {
                swRegistration = registration;
                
                // Check for updates
                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // New version available
                            showUpdateNotification();
                        }
                    });
                });
            });

            // Listen for messages from service worker
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data && event.data.type === 'SW_UPDATE_AVAILABLE') {
                    showUpdateNotification();
                } else if (event.data && event.data.type === 'SW_UPDATE_READY') {
                    // Update is ready, refresh the page
                    window.location.reload();
                }
            });
        }

        // Show update notification
        function showUpdateNotification() {
            updateNotification.classList.add('show');
            
            // Auto-hide after 10 seconds
            setTimeout(() => {
                updateNotification.classList.remove('show');
            }, 10000);
        }

        // Handle update button click
        updateBtn.addEventListener('click', () => {
            updateApp();
        });

        // Handle refresh button click
        refreshBtn.addEventListener('click', () => {
            updateApp();
        });

        // Update the app
        function updateApp() {
            if (swRegistration && swRegistration.waiting) {
                // Tell the waiting service worker to skip waiting
                swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
            } else {
                // Fallback: just reload the page
                window.location.reload();
            }
        }

        // Check for updates periodically (every 30 minutes)
        setInterval(() => {
            if (swRegistration) {
                swRegistration.update();
            }
        }, 30 * 60 * 1000);
    </script>
</body>
</html>
